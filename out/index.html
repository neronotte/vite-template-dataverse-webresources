<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Page</title>
    <script type="text/javascript" lang="javascript">
        /*
        * This variable must be set to the URL of the web resource that contains the homepage configuration.
        * The web resource must be a valid JS file that exports a const named `config`. 
        * An example of such a file is `config-template.js`.
        * The URL should be relative to the folder that will contain the compiled JS of the current page.
        */
        window.__homepageconfigwebresourceurl__ = "";
    </script>
    <style type="text/css">
      html,
      body {
        margin: 0;
        padding: 0;
      }
      
      /* use viewport-relative units to cover page fully */
      body {
        height: calc(100svh - 1px);
        width: calc(100svw - 1px);
      }
      
      /* include border and padding in element width and height */
      * {
        box-sizing: border-box;
      }
      
      
      code {
        font-family: source-code-pro, Menlo, Monaco, Consolas, 'Courier New', monospace;
      }
      
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
          </style>
          <script src="../../../ClientGlobalContext.js.aspx" type="text/javascript" ></script>
    <script type="module" crossorigin src="./app.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
